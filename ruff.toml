# Lint configuration, so that `ruff check .` gives the same answer locally and
# in CI. Ruff is a development tool only; it is not a runtime dependency.

target-version = "py310"
line-length = 100

exclude = [
    "**/node_modules",
    # task1 and task2 are submitted coursework, preserved as-is. See the
    # "Known limitations" section of the root README for the defects they
    # carry and why they have not been edited.
    "task2-cryptarithm-z3",
]

[lint]
select = ["F", "E4", "E7", "E9", "B", "UP", "I"]
ignore = [
    # `l` reads as "left" in the (top, right, bottom, left) edge tuples that
    # run through the TetraVex model; renaming it would obscure the domain.
    "E741",
]

[lint.per-file-ignores]
# pytest's parametrize passes arguments that a test body may not reference —
# ids are built from them — so unused-argument warnings are noise here.
"**/tests/*" = ["ARG001", "ARG002"]
